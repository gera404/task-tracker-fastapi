[tool.mypy]
python_version = "3.14"
mypy_path = "src"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[project]
name = "library-catalog"
version = "0.1.0"
description = ""
authors = [
    {name = "Максим",email = "maksim.lucky22@yandex.ru"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.162.4,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "greenlet (>=3.5.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "ruff (>=0.17.4,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)"
]
